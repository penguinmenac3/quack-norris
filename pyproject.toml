[project]
name = "quack-norris"
version = "4.0.3"
description = "Reusable LLM + agent core for Quack Norris"
readme = "README_PYPI.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "httpx==0.28.1",
    "pyyaml>=6.0",
    "pip-system-certs>=4.0",
    "agent-client-protocol==0.12.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.4",
    "ty>=0.0.1a0"
]

[project.scripts]
quack-norris         = "quack_norris.acp.__main__:main"
quack-norris-manage  = "quack_norris.skills_and_agents.manage.__main__:main"
quack-norris-sandbox = "quack_norris.sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quack_norris"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: requires a running LLM endpoint and llms.yaml (deselect with -m 'not live')",
]
