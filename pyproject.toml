[project]
name = "quack-norris"
version = "3.0.0"
description = "Reusable LLM + agent core for Quack Norris"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "ty>=0.0.1a0"
]

[project.scripts]
quack-norris         = "quack_norris.cli.__main__:main"
quack-norris-ui      = "quack_norris.webui.__main__:main"
quack-norris-manage  = "quack_norris.manage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quack_norris"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires a running LLM endpoint and llms.yaml (deselect with -m 'not live')",
]
