# This file can live in the project directory (project-local overrides) and/or
# in ~/.quack-norris/config.yaml (global defaults). The local file is merged on
# top of the global one, so it doesn't need to repeat everything — e.g. a
# project-local file could set just `defaults.model` or one `llms:` group.

defaults:
  model: ollama/qwen3:14b   # default model, "group/model-name"; overridable via --model

# Context window management (all optional; defaults shown below).
# `verbatim` and `checkpoint_at` are fractions of the model's context window —
# set `context_window` on each llms: entry below, or they measure against the
# wrong size.  `checkpoint_reduction_rate` is a fraction of the history itself.
context_management:
  enabled: true                   # on/off; manual /compact is unaffected
  verbatim: 0.30                  # newest slice kept fully intact; older tool output is redacted
  checkpoint_at: 0.80             # utilisation that triggers a checkpoint
  checkpoint_reduction_rate: 0.5  # share of the history each checkpoint summarises away
  max_tool_output: 4096           # per-result cap in tokens; head and tail are kept
  summarizer_model: null          # model used for checkpoint summaries; null = the conversation's model

llms:
  - group: ollama
    provider: OpenAI
    api_endpoint: http://localhost:11434/v1
    api_key: ollama
    context_window: 4096  # default ollama limit is 4096

  - group: openai
    provider: OpenAI
    api_endpoint: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    models:
      - gpt-4o
      - gpt-4o-mini
      - o3

  - group: bedrock
    provider: AWSBedrock
    api_endpoint: https://bedrock.my-corp.example.com
    api_key: ${AWS_BEARER_TOKEN_BEDROCK}
    region: us-east-1
    models:
      - anthropic.claude-3-5-sonnet-20241022-v2:0

  - group: azure
    provider: AzureOpenAI
    api_endpoint: https://my-resource.openai.azure.com
    api_key: ${AZURE_OPENAI_KEY}
    api_version: "2024-02-01"
    models:
      - gpt-4o
